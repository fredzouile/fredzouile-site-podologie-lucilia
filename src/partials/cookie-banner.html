<div class="cookie-banner" id="cookie-banner" role="region" aria-labelledby="cookie-banner-title" data-days="{{@ blocks.cookieDays }}" hidden>
    <div class="cookie-banner__inner">
      <p class="cookie-banner__text">
        <strong id="cookie-banner-title">Cookies</strong> — Aucun cookie publicitaire ni de mesure d'audience.
        Seule la carte Google Maps en dépose, si vous acceptez de l'afficher.
        <a href="/confidentialite/#cookies">En savoir plus</a>
      </p>
      <div class="cookie-banner__actions">
        <button type="button" class="btn btn--outline btn--sm" data-consent="refuse">Refuser</button>
        <button type="button" class="btn btn--outline btn--sm" data-consent="accept">Accepter</button>
      </div>
    </div>
  </div>
