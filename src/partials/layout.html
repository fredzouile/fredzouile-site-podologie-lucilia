<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{@ page.description }}">
  {{{ blocks.canonical }}}
  {{{ blocks.robots }}}
  <meta name="theme-color" content="#FBF8F3">
  <meta name="format-detection" content="telephone=no">
  <link rel="preload" href="/assets/fonts/source-sans-3-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{@ assets.css }}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="{{@ site.nomSite }}">
  <meta property="og:title" content="{{@ page.title }}">
  <meta property="og:description" content="{{@ page.description }}">
  <meta property="og:url" content="{{@ page.canonical }}">
  <meta property="og:image" content="{{@ site.siteUrl }}/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lucilia Afonso, pédicure-podologue à Paris 16e">
  <meta name="twitter:card" content="summary_large_image">
  {{{ blocks.jsonld }}}
  <script src="{{@ assets.js }}" defer></script>
</head>
<body class="{{@ page.bodyClass }}">
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  {{> icons }}
  {{> header }}
  <main id="contenu" tabindex="-1">
{{{ blocks.content }}}
  </main>
  {{> footer }}
  {{> mobile-cta }}
  {{{ blocks.cookieBanner }}}
</body>
</html>
